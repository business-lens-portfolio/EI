<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The El’s Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--card:#111;--tx:#fff;--soft:#e5e5e5;--mut:#9a9a9a;--rose:#c85a78;--rose2:#e07a96;--blush:#f4d6de;--line:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;font-weight:300;overflow-x:hidden}
.script{font-family:'Dancing Script','Brush Script MT',cursive;font-weight:600}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.p{position:absolute;left:0;top:0;will-change:transform;opacity:.0;transition:opacity 1.2s}
.p.on{opacity:.75}
header{position:relative;z-index:1;text-align:center;padding:48px 20px 24px}
.logo{width:150px;height:150px;border-radius:50%;background:#050505;border:1px solid var(--line);margin:0 auto 18px;display:grid;place-items:center;box-shadow:0 0 60px rgba(200,90,120,.25);animation:pop 1.1s cubic-bezier(.2,.8,.2,1) both}
header h1{font-size:54px;margin:0;line-height:1;animation:up .9s .25s both}
header .by{letter-spacing:.35em;font-size:11px;color:var(--rose2);text-transform:uppercase;margin-top:6px;animation:up .9s .4s both;font-weight:400}
header h2{font-size:30px;margin:22px 0 0;color:var(--soft);animation:up .9s .55s both}
.rule{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--rose),transparent);margin:18px auto 0}
nav{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav div{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
nav div::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--soft);text-decoration:none;font-size:12px;letter-spacing:.06em;padding:8px 14px;border:1px solid var(--line);border-radius:99px;transition:.25s;font-weight:400}
nav a.act{background:var(--rose);border-color:var(--rose);color:#fff}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:10px 20px 60px}
section{padding-top:34px;opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
section.in{opacity:1;transform:none}
section h3{font-size:36px;margin:0 0 6px;color:var(--tx);display:flex;align-items:center;gap:12px}
section h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--rose),transparent)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-weight:400;color:var(--soft)}
.row span{color:var(--blush);white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
.row:hover b{color:var(--rose2)}
footer{position:relative;z-index:1;text-align:center;padding:30px 20px 50px;color:var(--mut);font-size:12px}
footer .script{font-size:26px;color:var(--rose2)}
.bp{transform-box:fill-box;transform-origin:50% 50%;animation-duration:1.8s;animation-delay:.7s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.9,.25,1.15)}
.st{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:steam 3.2s ease-out 1.6s infinite}
.st.s2{animation-delay:3.2s}
@keyframes steam{0%{opacity:0;transform:translateY(16px) scale(.5)}25%{opacity:.95}100%{opacity:0;transform:translateY(-6px) scale(1.1)}}
.bp.l{animation-name:bl}.bp.r{animation-name:br}.bp.c{animation-name:bc}
@keyframes bl{from{transform:translate(18px,8px) scale(.05) rotate(0)}to{transform:rotate(-35deg)}}
@keyframes br{from{transform:translate(-18px,8px) scale(.05) rotate(0)}to{transform:rotate(35deg)}}
@keyframes bc{from{transform:translateY(10px) scale(.05)}to{transform:none}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}section{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<header>
  <div class="logo">
    <svg viewBox="0 0 120 120" width="110" height="110" aria-label="The El logo">
      <g class="st"><path d="M52 8c-6 8-3 14 2 18-5-8 1-12 6-18 4 7 2 12-1 17 6-3 8-10 5-17" fill="#fff" transform="scale(.8) translate(14 0)"/></g>
      <g class="st s2"><path d="M52 8c-6 8-3 14 2 18-5-8 1-12 6-18 4 7 2 12-1 17 6-3 8-10 5-17" fill="#fff" transform="scale(.8) translate(14 0)"/></g>
      <ellipse class="bp l" cx="42" cy="62" rx="12" ry="17" fill="#a85469"/>
      <ellipse class="bp r" cx="78" cy="62" rx="12" ry="17" fill="#a85469"/>
      <ellipse class="bp c" cx="60" cy="58" rx="14" ry="20" fill="#d4667e"/>
      <path class="bp c" d="M60 40c-4 8 4 14 0 36" stroke="#0a0a0a" stroke-width="2.5" fill="none"/>
      <path d="M26 56c0 22 14 30 34 30s34-8 34-30" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M94 52c10 0 14 8 6 14" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M14 96c30 8 62 6 84-4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <h1 class="script">The El</h1>
  <div class="by">by Leen Horani</div>
  <h2 class="script">The El’s Menu</h2>
  <div class="rule"></div>
</header>
<nav><div id="pills"></div></nav>
<main id="menu"></main>
<footer><div class="script">The El</div>Mecca Street · All prices in JD</footer>
<script>
const M=[
["Hot Drinks","hot",[["Espresso","2.00"],["Americano","2.50"],["Double Turkish","2.25"],["Cortado","2.15"],["Flat White","2.25"],["Cappuccino","3.10"],["Latte","3.10"],["Spanish Latte","3.50"],["Salted Caramel","3.50"],["Mocha","3.50"],["White Mocha","3.50"],["Pistachio Latte","3.50"],["Caramel Macchiato","3.50"],["Hot Chocolate","3.25"],["White Chocolate","3.25"]]],
["Iced Drinks","iced",[["Cold Brew","3.75"],["V60","3.65"],["Americano","2.50 / 2.75"],["Latte","3.00 / 3.50"],["Spanish Latte","3.25 / 3.75"],["Mocha","3.50 / 3.75"],["White Mocha","3.50 / 3.75"],["Salted Caramel","3.50 / 3.75"],["Caramel Macchiato","3.50 / 3.75"]]],
["Mojitos","moj",[["Energy Mojito","3.50"],["Soda Mojito","2.85"]]],
["Frappes","frap",[["Caramel Frappe","3.85 / 4.00"],["Nutella Frappe","3.85 / 4.00"],["Mocha Frappe","3.85 / 4.00"],["Salted Caramel Frappe","3.85 / 4.00"],["Espresso Frappe","3.75 / 4.00"]]],
["Milkshakes","shake",[["Fruit Milkshake","3.75 / 4.00"],["Nutella Milkshake","3.75 / 4.00"],["Caramel Milkshake","3.75 / 4.00"],["Vanilla Milkshake","3.75 / 4.00"],["Salted Caramel Milkshake","3.75 / 4.00"]]],
["Chai","chai",[["Black Tea","2.25"],["Matcha","3.75 / 4.00"],["Chai Spicy Latte","3.50"]]],
["Smoothies","smo",[["The El Smoothie","4.00 / 4.25"],["Passion Fruit Smoothie","3.75 / 4.00"],["Mango Smoothie","3.75 / 4.00"],["Peach Smoothie","3.75 / 4.00"],["Mix Berries Smoothie","3.75 / 4.00"],["Yellow Smoothie","3.75 / 4.00"]]],
["Refreshments","ref",[["Redbull","2.50"],["Water","0.75"],["Soda","1.50"]]],
["Yoghurt Base","yog",[["Strawberry Yogo","4.25 / 4.50"],["Passion Fruit Yogo","4.25 / 4.50"],["Blueberry Yogo","4.25 / 4.50"],["Peach Yogo","4.25 / 4.50"],["Mixed Berries Yogo","4.25 / 4.50"],["Yellow Yogo","4.25 / 4.50"],["Vanilla Yogo","4.25 / 4.50"]]],
["Leen’s Favorites","fav",[["Brownie Latte","3.75 / 4.00"],["Ruby Latte","3.75 / 4.00"],["Gold Mocha","3.75 / 4.00"],["Coze Latte","4.25 / 4.50"],["Toffie Crunch Latte","3.75 / 4.00"],["Strawberry Matcha","4.40 / 4.65"],["Chai Tea Latte","3.50 / 3.75"],["Peach and Passion Yogo","4.50 / 4.75"],["The El Frappe","4.00 / 4.25"]]],
["Add-ons","add",[["Extra Syrup","0.65"],["Extra Milk","0.65"],["Extra Shot","0.65"],["Decaf","0.65"],["Cold Foam","0.25"]]]
];
const menu=document.getElementById('menu'),pills=document.getElementById('pills');
M.forEach(([t,id,items])=>{
  const s=document.createElement('section');s.id=id;
  s.innerHTML='<h3 class="script">'+t+'</h3>'+items.map(i=>'<div class="row"><b>'+i[0]+'</b><span>'+i[1]+' JD</span></div>').join('');
  menu.appendChild(s);
  const a=document.createElement('a');a.href='#'+id;a.textContent=t;a.dataset.id=id;pills.appendChild(a);
});
const secs=[...document.querySelectorAll('section')];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
secs.forEach(s=>io.observe(s));
const act=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){pills.querySelectorAll('a').forEach(a=>{const on=a.dataset.id===e.target.id;a.classList.toggle('act',on);if(on){const l=a.offsetLeft-pills.clientWidth/2+a.clientWidth/2;pills.scrollTo({left:l,behavior:'smooth'})}})}}),{rootMargin:'-30% 0px -60% 0px'});
secs.forEach(s=>act.observe(s));
// Rose petals
const box=document.getElementById('petals'),N=matchMedia('(max-width:600px)').matches?12:18,ps=[];
const cols=['#c85a78','#e07a96','#f4d6de','#a85469'];
for(let i=0;i<N;i++){
  const e=document.createElement('div');e.className='p';
  const rose=i%4===0,sz=rose?34+Math.random()*20:12+Math.random()*14,c=cols[i%4];
  e.innerHTML=rose
   ?'<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="'+c+'"/><path d="M20 8c8 0 12 8 6 14-4 4-10 2-10-3 0-4 5-5 7-2" stroke="#0a0a0a" stroke-opacity=".5" stroke-width="2" fill="none"/></svg>'
   :'<svg width="'+sz+'" height="'+sz*1.3+'" viewBox="0 0 20 26"><path d="M10 0C20 8 20 20 10 26 0 20 0 8 10 0z" fill="'+c+'"/></svg>';
  box.appendChild(e);
  ps.push({e,x:Math.random(),y:Math.random(),d:.15+Math.random()*.7,r:Math.random()*360,sw:Math.random()*6.28,v:45+Math.random()*55});
  setTimeout(()=>e.classList.add('on'),300+i*140);
}
let sy=scrollY,last=performance.now();
addEventListener('scroll',()=>{sy=scrollY},{passive:true});
function tick(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  const W=innerWidth,H=innerHeight;
  ps.forEach(p=>{
    p.y+=p.v*dt/H;p.sw+=dt*.8;
    const yy=((p.y*H+sy*p.d*.5)%(H+80)+(H+80))%(H+80)-40;
    const xx=p.x*W+Math.sin(p.sw)*28;
    p.e.style.transform='translate('+xx+'px,'+yy+'px) rotate('+(p.r+sy*.08*p.d+Math.sin(p.sw)*25)+'deg)';
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
